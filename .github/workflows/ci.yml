name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install ruff
      # Pinned deliberately: an unpinned ruff silently adopts new rules on release,
      # so a build that passed yesterday fails today with no code change. Bump this
      # on purpose, with the fixes in the same commit.
      run: pip install ruff==0.16.1
    - name: Lint
      run: ruff check .
    - name: Format check
      run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest
    - name: Run tests
      run: pytest -q
